---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      generic-device-plugin:
        type: daemonset
        pod:
          priorityClassName: system-node-critical
          nodeSelector:
            feature.node.kubernetes.io/amd-gpu: "true"
        containers:
          app:
            image:
              repository: ghcr.io/squat/generic-device-plugin
              tag: 0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
            # devic.es/dri-render is a share of a node's DRM render node, not
            # an exclusive GPU claim — count: 2 lets two pods claim it at
            # once and rely on the kernel to time-slice between them. See
            # docs/adr/0003-reject-amd-gpu-operator-for-integrated-graphics.md
            #
            # card and kfd ride along with renderD128 in the same group:
            # AMF-based encode (Channels DVR) needs /dev/kfd, not just the
            # render node — confirmed by CreateComponent failing until it
            # was granted. This matches every device the old amd.com/gpu
            # resource always bundled into one allocation (see
            # ROCm/k8s-device-plugin's Allocate(), which unconditionally
            # attaches /dev/kfd plus card+renderD for every claim). VAAPI
            # (jellyfin) only ever needed renderD128; it just gets the rest
            # for free as part of the same bundle.
            #
            # HOST paths are /dev/dri/by-path (udev's PCI-address-keyed
            # symlinks), not /dev/dri/card0 or renderD128 directly — the
            # Talos 1.14 kernel bump (6.12 -> 6.18) started registering
            # simpledrm on the EFI framebuffer before amdgpu probes, so
            # amdgpu now lands on DRM minor 1 (card1) instead of minor 0.
            # That zeroed out this resource cluster-wide, since the group's
            # declared paths no longer all resolved. by-path is keyed on the
            # PCI address and is stable across that renumbering.
            #
            # mountPath pins the CONTAINER paths back to the canonical
            # /dev/dri names. Without it the plugin defaults mountPath to
            # path, and the container sees only by-path/* device nodes —
            # libdrm resolves a node's canonical name out of sysfs and then
            # requires it under /dev/dri, so libva (VAAPI/jellyfin) and radv
            # (Vulkan -> AMF/Channels) both fail to find any device and
            # silently fall back to software. Verified: creating just
            # /dev/dri/renderD128 flips vainfo and h264_amf from failing to
            # working, with no other change.
            args:
              - --domain
              - devic.es
              - --device
              - |
                name: dri-render
                groups:
                  - count: 2
                    paths:
                      - path: "/dev/dri/by-path/pci-0000:66:00.0-render"
                        mountPath: /dev/dri/renderD128
                      - path: "/dev/dri/by-path/pci-0000:66:00.0-card"
                        mountPath: /dev/dri/card0
                      - path: /dev/kfd
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 20Mi
    persistence:
      device-plugins:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
        globalMounts:
          - path: /var/lib/kubelet/device-plugins
      dev:
        type: hostPath
        hostPath: /dev
        globalMounts:
          - path: /dev
