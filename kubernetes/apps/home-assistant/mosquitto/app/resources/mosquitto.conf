# MQTT broker between rethink (the LG Cloud Stand-in) and Home Assistant.
# Cluster-only: the Service is ClusterIP, nothing on any VLAN reaches it.
#
# No persistence: rethink republishes its discovery configs whenever HA
# announces itself on homeassistant/status, so a restart loses nothing
# that isn't rebuilt within seconds of HA reconnecting.
listener 1883
allow_anonymous false
# Rendered (hashed) by the init container from mosquitto-secret.
password_file /mosquitto/passwd/passwd
persistence false
log_dest stdout
