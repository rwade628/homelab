---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: attic-configmap
    files:
      - server.toml=./resources/server.toml
generatorOptions:
  disableNameSuffixHash: true
