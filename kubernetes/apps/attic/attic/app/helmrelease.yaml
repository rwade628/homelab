---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: attic
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      attic:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/zhaofengli/attic
              tag: main@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
            args:
              - -f
              - /etc/attic/server.toml
              - --mode
              - monolithic
            env:
              RUST_LOG: info
              ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64:
                valueFrom:
                  secretKeyRef:
                    name: attic-secret
                    key: ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                    httpHeaders:
                      - name: Host
                        value: "attic.${SECRET_DOMAIN}"
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: "attic.${SECRET_DOMAIN}"
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: "{{ .Release.Name }}"
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: attic
        globalMounts:
          - path: /attic-data
      storage:
        existingClaim: attic-storage
        globalMounts:
          - path: /attic-storage
      config-file:
        type: configMap
        name: attic-configmap
        globalMounts:
          - path: /etc/attic/server.toml
            subPath: server.toml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
