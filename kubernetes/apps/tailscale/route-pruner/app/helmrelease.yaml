---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: route-pruner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      route-pruner:
        type: cronjob
        cronjob:
          suspend: true # paused pending redesign -- see docs/adr/0008 (disable-via-API leaves routes stuck in "awaiting approval" forever, not self-healing as ADR 0004 assumed)
          schedule: 0 4 1 * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: docker.io/library/golang
              tag: 1.27-alpine
            envFrom:
              - secretRef:
                  name: route-pruner-secret
            env:
              GOCACHE: /tmp/go-cache
              GOTMPDIR: /tmp
              GOMAXPROCS: "1"
            command: ["go"]
            args: ["run", "/app/main.go"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      script:
        type: configMap
        name: route-pruner-configmap
        globalMounts:
          - path: /app/main.go
            subPath: main.go
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
