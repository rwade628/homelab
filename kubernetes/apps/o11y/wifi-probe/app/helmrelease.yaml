---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Collector for the Wi-Fi Stall probe (source: rwade628/wifi-probe, design:
# rwade628/workbench#24). The Probe Device (iPad) opens
# https://wifi-probe.${SECRET_DOMAIN}/?device=ipad; the Wired Reference on
# TrueNAS uploads here too. HTTPS throughout: the page needs a secure context
# (Wake Lock), and Safari blocks http:// fetches from an https:// page. Ticks and Probe Gaps are logged as JSON to stdout, which the
# victoria-logs-collector ships to VictoriaLogs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wifi-probe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      wifi-probe:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/rwade628/wifi-probe
              tag: 0.2.0
            args: ["collector"]
            env:
              PORT: &port 8080
              # N in the Probe Gap definition. Provisional: reset it from the
              # noise floor (3-4 quiet days of iPad Gap lengths).
              MIN_GAP_SECONDS: "2"
              # Same list for both devices. "truenas" is TrueNAS's own nginx
              # (wired, outside k8s; 60-byte unauthenticated response, Let's
              # Encrypt cert); "collector" is this pod via envoy-internal.
              TARGETS: >-
                [{"name":"truenas","url":"https://truenas.${SECRET_DOMAIN}/api/versions"},
                {"name":"collector","url":"https://wifi-probe.${SECRET_DOMAIN}/ping"},
                {"name":"apple","url":"https://captive.apple.com/hotspot-detect.html"},
                {"name":"cloudflare","url":"https://1.1.1.1/cdn-cgi/trace"}]
              TZ: America/New_York
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        controller: wifi-probe
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    serviceMonitor:
      app:
        serviceName: wifi-probe
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 30s
