---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
# The gateway-wide policy (network/envoy) retries twice on connection reset.
# For this route that would hide the very failures the "collector" probe
# target exists to see, so this route-level policy replaces it with none.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: wifi-probe
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wifi-probe
  retry:
    numRetries: 0
