---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      omada-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/rcooler/omada_exporter
              tag: 2.4.2@sha256:5717e218e77b7173a07999d347c84f48a0c3991298883ffef410016f1cc96b05
            env:
              OMADA_HOST: https://omada.omada.svc.cluster.local:443
              OMADA_SITE: Default
              OMADA_INSECURE: "true"
              OMADA_TRACK_CLIENT_METRICS: "true"
              OMADA_TRACK_PORT_METRICS: "false"
              OMADA_TRACK_INSIGHT_METRICS: "false"
            envFrom:
              - secretRef:
                  name: omada-exporter-credentials
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 9202
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    service:
      app:
        ports:
          metrics:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            interval: 60s
            scrapeTimeout: 30s
