---
# yaml-language-server: $schema=https://json.schemastore.org/service
# The chart's own Service (victoria-logs, in this same namespace) is headless
# (clusterIP: None) and already carries the syslog-udp:514 port, but a headless
# Service has no stable virtual IP for anything outside the cluster to target.
# UDP, not TCP: RouterOS's remote logging action is UDP-only (RFC3164-style),
# no TCP syslog client exists in RouterOS at all.
# Cilium LoadBalancer, same pattern as k8s-gateway (network ns) - proven in
# production for real UDP traffic (DNS:53) under this cluster's dsr LB mode.
# Two things were tried and rejected first: the Talos control-plane VIP
# (only actually serves port 6443, not a general floating IP - proven by
# direct UDP test) and a single node's IP via NodePort (works, but ties
# reachability to one node with no failover, which is worse than this).
# See ADR 0005.
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  annotations:
    lbipam.cilium.io/ips: "10.0.10.151"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
  ports:
    - name: syslog-udp
      port: 514
      protocol: UDP
      targetPort: syslog-udp
