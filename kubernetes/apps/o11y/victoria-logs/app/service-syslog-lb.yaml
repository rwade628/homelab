---
# yaml-language-server: $schema=https://json.schemastore.org/service
# The chart's own Service (victoria-logs, in this same namespace) is headless
# (clusterIP: None) and already carries the syslog-tcp:514 port, but a headless
# Service has no stable virtual IP for anything outside the cluster to target.
# NodePort, not LoadBalancer: reachable at the Talos control-plane VIP
# (10.0.10.245, ARP-based, already load-bearing for kube-apiserver) on any
# node regardless of which one runs the pod - no dependency on Cilium LB
# IPAM or BGP, both flagged as not fully reliable here. See ADR 0005.
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: server
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/name: victoria-logs-single
  ports:
    - name: syslog-tcp
      port: 514
      protocol: TCP
      targetPort: syslog-tcp
      nodePort: 31842
