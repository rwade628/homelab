---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: drm-exporter
    hostAccess:
      devDri: /dev/dri
    # The chart README says AMD-only nodes can run unprivileged (drop
    # capabilities, non-root podSecurityContext) — that doesn't hold on
    # Talos. Talos's containerd sets device_ownership_from_security_context
    # = true, which disables the legacy implicit cgroup-allow that most
    # distros grant a hostPath-mounted device node; without it, a
    # non-privileged container can bind-mount /dev/dri and still get EPERM
    # opening it, regardless of DAC/group permissions. Confirmed against the
    # AMD GPU operator's own metrics-exporter pod, which hostPath-mounts
    # /dev identically and only works because it runs privileged.
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      capabilities: null
    nodeSelector:
      feature.node.kubernetes.io/amd-gpu: "true"
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
