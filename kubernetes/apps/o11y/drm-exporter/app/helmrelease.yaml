---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: drm-exporter
    hostAccess:
      devDri: /dev/dri
    # PERFMON (Intel perf PMU engine utilization) and SYS_RAWIO (Intel MSR
    # package power/temperature) are both Intel-only and unused on AMD, which
    # reads everything through sysfs/hwmon — per the chart README, AMD-only
    # nodes can drop the capabilities and run non-root. supplementalGroups
    # matches talos/patches/global/machine-udev.yaml's GROUP="44" on
    # /dev/dri/{card*,renderD*}, the same group jellyfin/channels already run
    # in for the same device.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      supplementalGroups:
        - 44
    securityContext:
      capabilities:
        drop:
          - ALL
    nodeSelector:
      feature.node.kubernetes.io/amd-gpu: "true"
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
