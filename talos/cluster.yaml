cluster:
  etcd:
    advertisedSubnets:
      - 10.0.10.0/24
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
machine:
  time:
    disabled: false
    servers:
      - 162.159.200.1
      - 162.159.200.123
  udev:
    rules:
      - SUBSYSTEM=="drm", KERNEL=="card*", GROUP="44", MODE="0660"
      - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "1048576"
  net.core.default_qdisc: fq
  net.core.rmem_max: "67108864"
  net.core.wmem_max: "67108864"
  net.ipv4.neigh.default.gc_thresh1: "4096"
  net.ipv4.neigh.default.gc_thresh2: "8192"
  net.ipv4.neigh.default.gc_thresh3: "16384"
  net.ipv4.ping_group_range: 0 2147483647
  net.ipv4.tcp_congestion_control: bbr
  net.ipv4.tcp_fastopen: "3"
  net.ipv4.tcp_mtu_probing: "1"
  net.ipv4.tcp_notsent_lowat: "131072"
  net.ipv4.tcp_rmem: 4096 131072 67108864
  net.ipv4.tcp_slow_start_after_idle: "0"
  net.ipv4.tcp_window_scaling: "1"
  net.ipv4.tcp_wmem: 4096 65536 67108864
  sunrpc.tcp_max_slot_table_entries: "128"
  sunrpc.tcp_slot_table_entries: "128"
  user.max_user_namespaces: "11255"
---
apiVersion: v1alpha1
kind: EtcFileConfig
name: nfsmount.conf
mode: 0o644
contents: |
  [ NFSMount_Global_Options ]
  nfsvers=4.2
  hard=True
  nconnect=8
  noatime=True
  rsize=1048576
  wsize=1048576
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: containerd
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true
---
apiVersion: v1alpha1
kind: ResolverConfig
searchDomains:
  domains: []
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true # Requires Cilium `bpf.masquerade: false`
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.model == "CT1000P3PSSD8"
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - bond0-m0
bondMode: active-backup
mtu: 9000
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: bond0
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.0.10.245
link: bond0
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.30
vlanID: 30
parent: bond0
mtu: 9000
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.50
vlanID: 50
parent: bond0
mtu: 9000
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.99
vlanID: 99
parent: bond0
mtu: 9000
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  topology.kubernetes.io/region: main
nodeIP:
  validSubnets:
    - 10.0.10.0/24
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  allowed-unsafe-sysctls: net.ipv6.*
config:
  serializeImagePulls: false
  imageMaximumGCAge: 60m
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.69.0.0/16
serviceSubnets:
  - 10.96.0.0/16
